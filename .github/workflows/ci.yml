name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Metadata object storage for the test API: SeaweedFS's S3 gateway, as kippu-api's CI runs it.
  # SeaweedFS 4.51 (Docker Hub, pushed 2026-10-26), by digest (the multi-architecture index).
  SEAWEED_IMAGE_DIGEST: sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
  SEAWEED_IMAGE: chrislusf/seaweedfs@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
  SEAWEED_LOCAL_TAG: ibento-ci/seaweedfs:pinned

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The screen manifest is up to date, and every navigation declares its edge
        run: pnpm screens:check
      - run: pnpm build

  e2e:
    name: End to end against kippu-api (Chromium)
    runs-on: ubuntu-latest
    services:
      kippu-store:
        # The test API's Kippu store: its own PostgreSQL instance and credentials.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kippu_api
          POSTGRES_PASSWORD: kippu_api_ci
          POSTGRES_DB: kippu_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kippu_api -d kippu_api"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KIPPU_DATABASE_URL: postgres://kippu_api:kippu_api_ci@127.0.0.1:5432/kippu_api
      # A local stand-in: no object store, CDN or DNS record exists yet.
      KIPPU_METADATA_S3_BUCKET: kippu-metadata
      KIPPU_METADATA_S3_ENDPOINT: http://127.0.0.1:9000
      KIPPU_METADATA_S3_FORCE_PATH_STYLE: "true"
      KIPPU_METADATA_S3_ACCESS_KEY_ID: kippu_metadata
      KIPPU_METADATA_S3_SECRET_ACCESS_KEY: kippu_metadata_ci
      KIPPU_PROOFS_S3_BUCKET: kippu-proofs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A service container cannot be given SeaweedFS's `server` command, so it is started here.
      # The image is kept in the Actions cache; Docker Hub is reached only on a miss, with retries.
      - name: Restore the SeaweedFS image from the cache
        id: seaweed-image
        uses: actions/cache@v6
        with:
          path: /tmp/seaweedfs-image.tar
          key: seaweedfs-image-${{ env.SEAWEED_IMAGE_DIGEST }}
      - name: Pull the SeaweedFS image on a cache miss
        if: steps.seaweed-image.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$SEAWEED_IMAGE"; then break; fi
            if [ "$attempt" = 5 ]; then echo "Docker Hub did not serve $SEAWEED_IMAGE" >&2; exit 1; fi
            sleep $((attempt * 15))
          done
          # `docker load` does not restore a repository digest, so the cached image is tagged.
          docker tag "$SEAWEED_IMAGE" "$SEAWEED_LOCAL_TAG"
          docker save "$SEAWEED_LOCAL_TAG" -o /tmp/seaweedfs-image.tar
      - name: Start metadata object storage (SeaweedFS S3 gateway) with its buckets
        run: |
          if ! docker image inspect "$SEAWEED_LOCAL_TAG" >/dev/null 2>&1; then
            docker load -i /tmp/seaweedfs-image.tar
          fi
          docker run -d --name kippu-metadata-storage -p 9000:9000 -p 9333:9333 \
            -e AWS_ACCESS_KEY_ID=kippu_metadata -e AWS_SECRET_ACCESS_KEY=kippu_metadata_ci \
            "$SEAWEED_LOCAL_TAG" server -dir=/data -s3 -s3.port=9000 \
            -master.volumeSizeLimitMB=64 -volume.max=32
          # Ready once the master reports a leader and the S3 gateway answers (403 unsigned).
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9333/cluster/status | grep -q '"IsLeader":true' \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != 000 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs kippu-metadata-storage; exit 1; fi
          printf 's3.bucket.create -name kippu-metadata\ns3.bucket.create -name kippu-proofs\n' \
            | docker exec -i kippu-metadata-storage weed shell -master=127.0.0.1:9333
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  vendor:
    name: Vendored @kippurocks/api reproduces from its pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm vendor:check
