name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End to end — sign-in against kippu-api (Chromium)
    runs-on: ubuntu-latest
    services:
      kippu-store:
        # The test API's Kippu store: its own PostgreSQL instance and credentials.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kippu_api
          POSTGRES_PASSWORD: kippu_api_ci
          POSTGRES_DB: kippu_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kippu_api -d kippu_api"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KIPPU_DATABASE_URL: postgres://kippu_api:kippu_api_ci@127.0.0.1:5432/kippu_api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  vendor:
    name: Vendored @kippu/api reproduces from its pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm vendor:check
